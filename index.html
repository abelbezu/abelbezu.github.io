<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Accurate Clock - Single File</title>
    
    <style>
        /* Basic reset and background */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff; /* Dark background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #367788; /* Light blue text color */
        }

        /* Container for alignment */
        .container {
            text-align: center;
        }

        /* Styling for the clock display */
        #clock {
            font-size: 6rem; /* Large font size */
            font-weight: bold;
            letter-spacing: 5px;
            padding: 20px 40px;
            border: 5px solid #367788;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(97, 218, 251, 0.5); /* Glowing effect */
            transition: transform 0.3s ease;
        }

        /* Optional: a subtle hover effect */
        #clock:hover {
            transform: scale(1.02);
        }

        /* Styling for the info text */
        .gmt-info {
            margin-top: 20px;
            font-size: 1rem;
            color: #a0a0a0; /* Gray text */
        }

        /* Media query for smaller screens (e.g., phones) */
        @media (max-width: 600px) {
            #clock {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="clock">00:00:00</div>
        <p class="gmt-info">Time based on your device's clock</p>
    </div>
    
    <script>
        // Function to update the clock display
        function updateClock() {
            // 1. Get the current time from the user's system
            const now = new Date();

            // 2. Extract hours, minutes, and seconds
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // 3. Format the time: Pad single digits with a leading zero
            // Example: 5 -> "05"
            hours = String(hours).padStart(2, '0');
            minutes = String(minutes).padStart(2, '0');
            seconds = String(seconds).padStart(2, '0');

            // 4. Create the final time string (HH:MM:SS)
            const timeString = `${hours}:${minutes}:${seconds}`;

            // 5. Update the content of the HTML element
            const clockElement = document.getElementById('clock');
            if (clockElement) {
                clockElement.textContent = timeString;
            }
        }

        // Initial call to display the time immediately when the page loads
        updateClock();

        // Set up an interval to call the updateClock function every 1000 milliseconds (1 second)
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
