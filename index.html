<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accurate Clock with Beep</title>
    
    <style>
        /* Basic reset and background */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8fafc; /* Clean light background */
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #334155;
        }

        /* Container for alignment */
        .container {
            text-align: center;
            max-width: 90%;
        }

        /* Styling for the clock display */
        #clock {
            font-size: clamp(3rem, 15vw, 6rem); /* Responsive font size */
            font-weight: 800;
            letter-spacing: 2px;
            padding: 2rem 3rem;
            background: white;
            color: #0891b2; /* Cyan-600 */
            border: 4px solid #0891b2;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: default;
        }

        #clock:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 30px -5px rgba(8, 145, 178, 0.2);
        }

        /* Controls styling */
        .controls {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        button {
            background-color: #0891b2;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #0e7490;
        }

        button.muted {
            background-color: #64748b;
        }

        /* Styling for the info text */
        .gmt-info {
            font-size: 0.875rem;
            color: #64748b;
            margin: 0;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.active {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="clock">00:00:00</div>
        
        <div class="controls">
            <button id="soundToggle" class="muted">
                <span id="statusIcon" class="status-dot"></span>
                <span id="buttonText">Enable Sound</span>
            </button>
            <p class="gmt-info">Audio requires one click to start due to browser policies.</p>
        </div>
    </div>
    
    <script>
        let audioCtx = null;
        let isMuted = true;
        const clockElement = document.getElementById('clock');
        const soundToggle = document.getElementById('soundToggle');
        const buttonText = document.getElementById('buttonText');
        const statusIcon = document.getElementById('statusIcon');

        // Function to create a short beep using Web Audio API
        function playBeep() {
            if (isMuted || !audioCtx) return;

            // Resume context if it was suspended (common in some browsers)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine'; // Soft beep
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 note

            // Envelope to prevent "clicking" sound
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        // Function to update the clock display
        function updateClock() {
            const now = new Date();

            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');

            const timeString = `${hours}:${minutes}:${seconds}`;

            if (clockElement) {
                clockElement.textContent = timeString;
            }

            // Play beep every time the clock updates
            playBeep();
        }

        // Audio initialization on user interaction
        soundToggle.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            isMuted = !isMuted;
            
            if (isMuted) {
                soundToggle.classList.add('muted');
                buttonText.textContent = "Enable Sound";
                statusIcon.classList.remove('active');
            } else {
                soundToggle.classList.remove('muted');
                buttonText.textContent = "Mute Sound";
                statusIcon.classList.add('active');
                
                // Play a test beep immediately
                if (audioCtx.state === 'suspended') audioCtx.resume();
                playBeep();
            }
        });

        // Initial call
        updateClock();

        // Interval to call the updateClock function every second
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
