<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accurate Clock with Beep</title>
    
    <style>
        /* Basic reset and background */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #334155;
        }

        /* Container for alignment */
        .container {
            text-align: center;
            max-width: 90%;
        }

        /* Styling for the clock display */
        #clock {
            font-size: clamp(3rem, 15vw, 6rem);
            font-weight: 800;
            letter-spacing: 2px;
            padding: 2rem 3rem;
            background: white;
            color: #0891b2;
            border: 4px solid #0891b2;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: default;
        }

        #clock:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 30px -5px rgba(8, 145, 178, 0.2);
        }

        /* Controls styling */
        .controls {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        button {
            background-color: #0891b2;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #0e7490;
        }

        button.muted {
            background-color: #64748b;
        }

        /* Styling for the info text */
        .gmt-info {
            font-size: 0.875rem;
            color: #64748b;
            margin: 0;
            font-weight: 500;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.active {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="clock">00:00:00</div>
        
        <div class="controls">
            <button id="soundToggle">
                <span id="statusIcon" class="status-dot active"></span>
                <span id="buttonText">Mute Sound</span>
            </button>
            <p id="hintText" class="gmt-info">Click anywhere to activate the audio.</p>
        </div>
    </div>
    
    <script>
        let audioCtx = null;
        let isMuted = false; // Now ON by default
        const clockElement = document.getElementById('clock');
        const soundToggle = document.getElementById('soundToggle');
        const buttonText = document.getElementById('buttonText');
        const statusIcon = document.getElementById('statusIcon');
        const hintText = document.getElementById('hintText');

        // Function to create a short beep using Web Audio API
        function playBeep() {
            if (isMuted || !audioCtx) return;

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function updateClock() {
            const now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');

            if (clockElement) {
                clockElement.textContent = `${hours}:${minutes}:${seconds}`;
            }

            playBeep();
        }

        // Initialize Audio Context on first interaction
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                hintText.textContent = "Audio is active.";
                // Remove the global listener once initialized
                window.removeEventListener('click', initAudio);
                window.removeEventListener('touchstart', initAudio);
            }
        }

        // Listen for first click/touch to unlock audio
        window.addEventListener('click', initAudio);
        window.addEventListener('touchstart', initAudio);

        // Toggle functionality
        soundToggle.addEventListener('click', (e) => {
            // Prevent event bubbling so initAudio handles it if needed, 
            // but we also need to initialize if the button is the first thing clicked
            if (!audioCtx) initAudio();

            isMuted = !isMuted;
            
            if (isMuted) {
                soundToggle.classList.add('muted');
                buttonText.textContent = "Enable Sound";
                statusIcon.classList.remove('active');
            } else {
                soundToggle.classList.remove('muted');
                buttonText.textContent = "Mute Sound";
                statusIcon.classList.add('active');
                playBeep();
            }
            // Stop propagation so the global window click doesn't try to re-init needlessly
            e.stopPropagation();
        });

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
